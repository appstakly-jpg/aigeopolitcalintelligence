[project]
name = "gccintel"
version = "0.1.0"
description = "Ingestion, verification, risk, briefing and alerting workers for the GCC geopolitical intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "feedparser>=6.0.11,<7",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "python-docx>=1.1,<2",
  "cryptography>=43",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
llm = [
  "anthropic>=2.0",
  "openai>=1.40",
  "google-genai>=1.0",
]
pdf = ["playwright>=1.45"]
dev = [
  "pytest>=8",
  "aiosmtpd>=1.4",
  "ruff>=0.6",
]

[project.scripts]
gccintel = "gccintel.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gccintel*"]

[tool.setuptools.package-data]
gccintel = ["reports/templates/*.j2", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S608", "S311", "B008", "E501", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "B017"]
